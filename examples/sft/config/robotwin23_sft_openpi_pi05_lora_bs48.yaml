defaults:
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 4-7

runner:
  task_type: sft
  logger:
    log_path: "/data2/sjy/archive"
    project_name: rlinf
    experiment_name: "robotwin23_sft_pi05_lora_r32_bs48"
    logger_backends: ["tensorboard"]

  max_epochs: -1
  max_steps: 130000
  val_check_interval: -1
  save_interval: 10000

data:
  train_data_paths: "/data2/sjy/datasets/lerobot/robotwin_demo_clean_aloha_agilex_23task_v21"

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 12
  global_batch_size: 48
  seed: 0

  model:
    precision: null
    model_path: "/data2/sjy/checkpoints/openpi/pi05_base_pytorch"
    num_action_chunks: 50
    action_dim: 14
    add_value_head: False
    is_lora: True
    lora_rank: 32
    lora_scope: policy  # Adapt PaliGemma and the action expert; freeze base weights.
    openpi:
      config_name: "pi05_aloha_robotwin"
      detach_critic_input: True
      num_images_in_input: 3
      train_expert_only: False

  optim:
    lr: 2.5e-5
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1e-10
    clip_grad: 1.0
    total_training_steps: 130000
    lr_warmup_steps: 1000
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: False
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
