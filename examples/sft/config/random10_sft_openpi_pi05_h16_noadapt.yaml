defaults:

  - model/pi0_5@actor.model

  - training_backend/fsdp@actor.fsdp_config

  - override hydra/job_logging: stdout



hydra:

  run:

    dir: .

  output_subdir: null

  searchpath:

    - file://${oc.env:EMBODIED_PATH}/config/



cluster:

  num_nodes: 1

  component_placement:

    actor,env,rollout: 0-1



runner:

  task_type: sft

  logger:

    log_path: "../results"

    project_name: rlinf

    experiment_name: "random10_pi05_sft_h16_noadapt"

    logger_backends: ["tensorboard"]



  max_epochs: -1

  max_steps: 30000

  val_check_interval: -1

  save_interval: 5000



  resume_dir: null



data:

  train_data_paths: "/mnt/petrelfs/muyao/jiayusun/store/cache/huggingface/lerobot/robotwin_random_10_500_pi05_h16"



actor:

  group_name: "ActorGroup"

  training_backend: "fsdp"

  micro_batch_size: 16

  global_batch_size: 64

  seed: 0



  openpi_data:

    repo_id: "/mnt/petrelfs/muyao/jiayusun/store/cache/huggingface/lerobot/robotwin_random_10_500_pi05_h16"

    adapt_to_pi: False

    extra_delta_transform: True



  model:

    precision: null

    model_path: "/mnt/petrelfs/muyao/jiayusun/pi05_base_adapt_false"

    num_action_chunks: 16

    action_dim: 14

    add_value_head: False

    openpi_data:

      repo_id: "/mnt/petrelfs/muyao/jiayusun/store/cache/huggingface/lerobot/robotwin_random_10_500_pi05_h16"

      adapt_to_pi: False

      extra_delta_transform: True

    openpi:

      config_name: "pi05_aloha_robotwin_random10_h16"

      detach_critic_input: True

      num_images_in_input: 3

      train_expert_only: False



  optim:

    lr: 2.5e-5

    value_lr: 1.55e-4

    adam_beta1: 0.9

    adam_beta2: 0.95

    adam_eps: 1.0e-08

    weight_decay: 1e-10

    clip_grad: 1.0

    total_training_steps: 30000

    lr_warmup_steps: 1000

    lr_scheduler: "cosine"

    num_cycles: 0.5

    min_lr: 2.5e-6



  fsdp_config:

    strategy: "fsdp"

    sharding_strategy: "no_shard"

    use_orig_params: False

    gradient_checkpointing: False

    mixed_precision:

      param_dtype: ${actor.model.precision}

      reduce_dtype: ${actor.model.precision}

      buffer_dtype: ${actor.model.precision}

