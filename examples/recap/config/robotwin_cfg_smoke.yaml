defaults:
- model/pi0_5@actor.model
- training_backend/fsdp@actor.fsdp_config
- _self_
- override hydra/job_logging: stdout
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:REPO_PATH}/examples/sft/config/
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-7
runner:
  task_type: sft
  logger:
    log_path: /data2/sjy/recap/beat_block_hammer/iter000/runs
    project_name: rlinf
    experiment_name: policy_smoke
    logger_backends:
    - tensorboard
  max_epochs: 2
  max_steps: 2
  val_check_interval: -1
  save_interval: 2
data:
  num_workers: 2
  advantage_tag: robotwin_adv_smoke
  balance_dataset_weights: false
  seed: 42
  train_data_paths:
  - dataset_path: /data2/sjy/recap/beat_block_hammer/iter000/datasets/sft_smoke
    type: sft
    weight: 1.0
    task_name: beat_block_hammer
    robot_type: robotwin
    model_type: pi05
    return_min: -800.0
    return_max: 0.0
algorithm:
  adv_type: gae
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 8
  seed: 0
  model:
    precision: null
    model_path: /data2/sjy/checkpoints/robotwin8_A100_40k
    model_type: cfg_model
    add_value_head: false
    openpi:
      config_name: pi05_aloha_robotwin
      cfgrl_guidance_scale: 1.0
      unconditional_prob: 0.3
      train_expert_only: false
      guidance_type: positive
      positive_only_conditional: false
      action_chunk: 50
      action_env_dim: 14
      action_horizon: 50
      num_images_in_input: 3
      num_steps: 10
    strict_checkpoint: true
    num_action_chunks: 50
    action_dim: 14
  optim:
    lr: 5.0e-06
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    lr_scheduler: cosine
    lr_warmup_steps: 1
    total_training_steps: 2
    min_lr: 0.0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    use_orig_params: false
    gradient_checkpointing: true
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
reward:
  use_reward_model: false
critic:
  use_critic_model: false
