defaults:
- env/robotwin_beat_block_hammer@env.train
- _self_
- override hydra/job_logging: stdout
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:REPO_PATH}/examples/embodiment/config/
cluster:
  num_nodes: 1
  component_placement:
    collector: 0-7
runner:
  task_type: embodied
  logger:
    log_path: /data2/sjy/eval/robotwin6_SFT40k_failure_videos_20261106/move_can_pot/runs
    project_name: rlinf
    experiment_name: collection
    logger_backends:
    - tensorboard
  max_epochs: 200
  max_steps: 200
  only_eval: false
  val_check_interval: 10
  save_interval: 20
  resume_dir: null
  ckpt_path: /data2/sjy/checkpoints/robotwin8_A100_40k/full_weights.pt
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 4
  eval_rollout_epoch: 12
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 2
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1
env:
  group_name: EnvGroup
  enable_offload: true
  train:
    total_num_envs: 8
    distribute_tasks_across_workers: true
    reward_coef: ${algorithm.reward_coef}
    max_episode_steps: 400
    max_steps_per_rollout_epoch: 400
    group_size: ${algorithm.group_size}
    assets_path: /data2/sjy/RoboTwin-RLinf
    seeds_path: /data2/sjy/eval/robotwin6_SFT40k_failure_videos_20261106/move_can_pot/scene_pool.json
    center_crop: false
    task_config:
      embodiment:
      - aloha-agilex
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
      step_lim: 400
      clear_cache_freq: 1
      save_path: /data2/sjy/eval/robotwin6_SFT40k_failure_videos_20261106/move_can_pot/sim
      eval_video_log: false
      collect_data: false
      task_name: move_can_pot
    task_names:
    - move_can_pot
    auto_reset: false
    ignore_terminations: false
    use_fixed_reset_state_ids: false
    episode_log_path: /data2/sjy/eval/robotwin6_SFT40k_failure_videos_20261106/move_can_pot/logs/episodes.jsonl
    video_cfg:
      save_video: false
  eval:
    total_num_envs: 8
    distribute_tasks_across_workers: true
    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 400
    reward_coef: ${algorithm.reward_coef}
    max_steps_per_rollout_epoch: 400
    group_size: 1
    use_fixed_reset_state_ids: false
    is_eval: true
    assets_path: /data2/sjy/RoboTwin-RLinf
    seeds_path: /data2/sjy/rl_protocol/robotwin6/eval_manifest_96ep.json
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval
    center_crop: false
    task_config:
      embodiment:
      - aloha-agilex
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
      step_lim: 400
      clear_cache_freq: 1
      save_path: ${runner.logger.log_path}/${runner.logger.experiment_name}/sim_eval
      eval_video_log: false
      collect_data: false
    task_names: ${env.train.task_names}
    episode_log_path: ${runner.logger.log_path}/${runner.logger.experiment_name}/episodes/eval.jsonl
rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}
  eval_seed: 20261030
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 2
  global_batch_size: 128
  seed: 1234
  enable_offload: true
  model:
    model_path: /data2/sjy/checkpoints/robotwin8_A100_40k
    num_action_chunks: 50
    action_dim: 14
    add_value_head: false
    num_steps: 5
    openpi:
      config_name: pi05_aloha_robotwin
      num_images_in_input: 3
      noise_level: 0.3
      detach_critic_input: true
      train_expert_only: true
      guidance_type: no_guide
      positive_only_conditional: false
      action_chunk: 50
      action_env_dim: 14
      action_horizon: 50
      num_steps: 10
    is_lora: false
    model_type: cfg_model
    strict_checkpoint: true
  optim:
    lr: 5.0e-06
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 200
  fsdp_config:
    strategy: fsdp
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
  verify_rollout_consistency: true
reward:
  use_reward_model: false
critic:
  use_critic_model: false
weight_syncer:
  patch:
    init_sync:
      enabled: true
collect:
  output: /data2/sjy/recap/beat_block_hammer/rollout4096_sftpos_v4_restart/datasets/rollout
  seed: 20261106
  episodes_per_worker: 128
  validation_episodes_per_worker: 0
  num_envs_per_worker: 1
  fps: 15
  action_chunk: 50
  policy_checkpoint: null
