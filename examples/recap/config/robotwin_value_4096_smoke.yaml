  component_placement:
    actor,env,rollout: 0-7
runner:
  task_type: sft
  logger:
    log_path: /data2/sjy/recap/beat_block_hammer/rollout4096_v2/runs
    project_name: rlinf
    experiment_name: value_smoke
    logger_backends:
    - tensorboard
  max_epochs: 2
  max_steps: 2
  val_check_interval: 2
  save_interval: 2
  resume_dir: null
