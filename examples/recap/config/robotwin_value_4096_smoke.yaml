  train_num_workers: 2
  eval_num_workers: 1
  prefetch_factor: 2
  persistent_workers: false
  pin_memory: false
  include_state: true
  gamma: 1.0
  action_horizon: 50
  normalize_to_minus_one_zero: true
  include_next_obs: false
  action_dim: 14
  robot_type: robotwin
  model_type: pi05
  balance_weights: false
  seed: 42
  per_task_returns: true
  return_min: -800.0
  return_max: 0.0
algorithm:
  adv_type: gae
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 4
  global_batch_size: 128
  seed: 0
  model:
    precision: bf16
    siglip_path: /data2/sjy/recap_assets/siglip2-so400m-patch14-224
    gemma3_path: /data2/sjy/recap_assets/gemma-3-270m
    tokenizer_path: /data2/sjy/recap_assets/gemma-3-270m
    freeze_vlm: false
    action_dim: 14
    action_horizon: 50
    critic_expert_variant: gemma_100m
  optim:
    lr: 5.0e-05
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    lr_scheduler: constant
    lr_warmup_steps: 1
    total_training_steps: 2
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    use_orig_params: false
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
reward:
  use_reward_model: false
critic:
  use_critic_model: false
